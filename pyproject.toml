[project]
name = "hanjang"
version = "0.1.0"
description = "내 종목을 쉬운 글 한 장으로 — 주간 노트 만들기 + 모바일 웹"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "selectolax<1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 실제 API 를 부르는 테스트는 따로: pytest -m external
addopts = "-m 'not external'"
markers = ["external: 외부 API 호출"]

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["F"]  # 빠진 이름·안 쓰는 import 같은 실제 오류만 — 10/12 에 서버가 안 켜진 env 같은 것을 1초에 잡는다 (uvx ruff check hanjang tests deploy)
ignore = ["F811"]  # 그리기 도우미 이름(row·paras·mark…)을 함수 안에서 변수로 다시 쓰는 곳이 많다 — 버그가 아니다
